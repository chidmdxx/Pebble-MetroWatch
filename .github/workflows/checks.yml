name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/gitleaks-bin" \
            --no-same-owner --no-same-permissions gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan history
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          : > "$RUNNER_TEMP/empty.gitleaksignore"
          gitleaks git --no-banner --redact=100 --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/empty.gitleaksignore" \
            --log-opts="--all" .

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/calendar.test.js

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install Pebble CLI and SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/pebble"
          "$RUNNER_TEMP/pebble/bin/pip" install pebble-tool==5.1.2 uv==0.9.26
          export PATH="$RUNNER_TEMP/pebble/bin:$PATH"
          echo "$RUNNER_TEMP/pebble/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pebble/bin/pebble" sdk install 4.44
      - run: pebble build --sdk 4.44
      - name: Verify package metadata and targets
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          package = json.loads(pathlib.Path("package.json").read_text())
          bundles = list(pathlib.Path("build").glob("*.pbw"))
          assert len(bundles) == 1, bundles
          with zipfile.ZipFile(bundles[0]) as bundle:
              assert bundle.testzip() is None
              info = json.loads(bundle.read("appinfo.json"))
              platforms = {name.split("/")[0] for name in bundle.namelist()
                           if name.endswith("/pebble-app.bin")}
              assert platforms == set(package["pebble"]["targetPlatforms"])
              assert info["versionLabel"] == package["version"]
              assert info["uuid"] == package["pebble"]["uuid"]
          PY
